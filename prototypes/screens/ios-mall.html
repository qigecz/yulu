<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>渔路 · 渔具商城 · iOS</title>
  <style>
    :root {
      --bg:      #f3f5f2;
      --surface: #ffffff;
      --fg:      #1a2420;
      --muted:   #647a70;
      --border:  #dce2dc;
      --accent:  #2a8f7a;

      --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
      --fg-soft:     color-mix(in oklch, var(--fg) 6%, transparent);

      --font-display: 'Iowan Old Style', 'Charter', Georgia, serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'SF Mono', Menlo, monospace;

      --fs-body: 15px;
      --fs-meta: 12px;
      --radius-card: 18px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: radial-gradient(60% 80% at 50% 0%, color-mix(in oklch, var(--accent) 6%, var(--bg)) 0%, var(--bg) 60%);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .stage { display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .caption {
      font-family: var(--font-mono); font-size: 12px;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    }
    .caption strong { color: var(--fg); font-weight: 500; }

    .device {
      position: relative; width: 390px; height: 844px;
      border-radius: 56px; padding: 12px;
      background: linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.04) inset, 0 0 0 2px #000 inset,
                  0 28px 60px -12px rgba(0,0,0,0.45), 0 8px 20px -8px rgba(0,0,0,0.35);
      isolation: isolate;
    }
    .device::before, .device::after {
      content: ''; position: absolute; width: 3px;
      background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.06) 8%, transparent 16%, transparent 84%, rgba(255,255,255,0.04) 92%, transparent 100%);
      top: 100px; bottom: 100px; pointer-events: none;
    }
    .device::before { left: -1px; }
    .device::after  { right: -1px; }
    .island {
      position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
      width: 124px; height: 36px; background: #000; border-radius: 999px; z-index: 30;
    }
    .btn-rail { position: absolute; width: 4px; background: #0a0a0c; border-radius: 2px; }
    .btn-rail.left-1  { left: -3px; top: 174px; height: 32px; }
    .btn-rail.left-2  { left: -3px; top: 220px; height: 60px; }
    .btn-rail.left-3  { left: -3px; top: 290px; height: 60px; }
    .btn-rail.right-1 { right: -3px; top: 250px; height: 100px; }

    .screen {
      position: relative; width: 100%; height: 100%;
      background: var(--bg); border-radius: 44px; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .statusbar {
      flex: 0 0 47px; padding: 18px 26px 0;
      display: flex; align-items: flex-start; justify-content: space-between;
      font-family: var(--font-body); font-size: 15px; font-weight: 600;
      color: var(--fg);
    }
    .statusbar .right { display: inline-flex; align-items: center; gap: 6px; }
    .statusbar svg { width: 17px; height: 11px; fill: var(--fg); }
    .statusbar .battery { width: 25px; }

    .content {
      flex: 1 1 auto; overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .content::-webkit-scrollbar { display: none; }

    .home-indicator { flex: 0 0 28px; position: relative; }
    .home-indicator::after {
      content: ''; position: absolute; left: 50%; bottom: 8px;
      transform: translateX(-50%); width: 134px; height: 5px;
      background: var(--fg); border-radius: 999px; opacity: 0.85;
    }

    .meta { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--muted); }
    .num  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* header */
    .header {
      padding: 8px 20px 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .header .h-title { font-family: var(--font-display); font-size: 18px; letter-spacing: -0.01em; }
    .header .icon-btn {
      width: 36px; height: 36px; border-radius: 999px;
      background: var(--surface); border: 1px solid var(--border);
      display: grid; place-items: center; color: var(--fg); cursor: pointer;
      position: relative;
    }
    .header .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; }
    .header .icon-btn:hover { border-color: color-mix(in oklch, var(--accent) 45%, var(--border)); }
    .header .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .header .cart-badge {
      position: absolute; top: -4px; right: -4px;
      min-width: 17px; height: 17px; padding: 0 4px;
      border-radius: 999px; background: var(--accent); color: #fff;
      font-family: var(--font-mono); font-size: 10px; font-weight: 600;
      display: grid; place-items: center;
      border: 2px solid var(--bg);
    }

    /* promo banner */
    .promo {
      margin: 0 20px;
      padding: 16px;
      background: linear-gradient(135deg, color-mix(in oklch, var(--accent) 18%, var(--surface)), color-mix(in oklch, var(--accent) 8%, var(--surface)));
      border: 1px solid color-mix(in oklch, var(--accent) 30%, var(--border));
      border-radius: 16px;
      display: flex; align-items: center; gap: 14px;
    }
    .promo .p-icon {
      width: 46px; height: 46px; border-radius: 14px; flex-shrink: 0;
      background: var(--surface);
      display: grid; place-items: center;
      border: 1px solid color-mix(in oklch, var(--accent) 30%, var(--border));
    }
    .promo .p-icon svg { width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 1.6; }
    .promo .p-body { min-width: 0; }
    .promo .p-title { font-size: 15px; font-weight: 600; }
    .promo .p-desc { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .promo .p-tag {
      display: inline-flex; margin-top: 6px;
      padding: 3px 9px; border-radius: 999px;
      background: var(--accent); color: #fff;
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.05em;
    }

    /* category chips */
    .filter-scroll {
      display: flex; gap: 8px; overflow-x: auto;
      padding: 14px 20px 4px;
      -webkit-overflow-scrolling: touch;
    }
    .filter-scroll::-webkit-scrollbar { display: none; }
    .fchip {
      flex-shrink: 0; padding: 7px 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 999px; font-size: 13px; color: var(--fg);
      cursor: pointer; font-family: var(--font-body);
    }
    .fchip:hover { border-color: color-mix(in oklch, var(--accent) 45%, var(--border)); }
    .fchip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .fchip.on {
      background: var(--accent); color: #fff; border-color: transparent; font-weight: 600;
    }

    /* result meta row */
    .result-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 20px 10px;
    }
    .result-row .r-count { font-size: 13px; color: var(--muted); }
    .result-row .r-count strong { color: var(--fg); font-weight: 600; }

    /* product grid */
    .p-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      padding: 0 20px;
    }
    .p-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .p-card .p-img {
      aspect-ratio: 1;
      background: linear-gradient(135deg, var(--accent-soft), var(--fg-soft));
      border-bottom: 1px solid var(--border);
      display: grid; place-items: center;
      color: var(--muted); font-family: var(--font-mono); font-size: 10px;
      position: relative;
    }
    .p-card .p-flag {
      position: absolute; top: 8px; left: 8px;
      padding: 2px 7px; border-radius: 6px;
      font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.05em;
      background: var(--surface); color: var(--muted);
      border: 1px solid var(--border);
    }
    .p-card .p-flag.new { background: var(--accent); color: #fff; border-color: transparent; }
    .p-card .p-body { padding: 10px 12px 12px; display: flex; flex-direction: column; flex: 1; }
    .p-card .p-name { font-size: 13px; font-weight: 600; line-height: 1.35; }
    .p-card .p-spec { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .p-card .p-foot {
      display: flex; align-items: flex-end; justify-content: space-between; gap: 8px;
      margin-top: auto; padding-top: 8px;
    }
    .p-card .p-price { font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: var(--accent); letter-spacing: -0.01em; }
    .p-card .p-price em { font-style: normal; font-size: 11px; font-weight: 400; }
    .p-card .p-sold { font-size: 10px; color: var(--muted); margin-top: 2px; font-family: var(--font-mono); }
    .p-card .add-btn {
      width: 30px; height: 30px; border-radius: 10px;
      background: var(--accent-soft); color: var(--accent);
      border: none; display: grid; place-items: center; cursor: pointer;
      flex-shrink: 0;
      font-size: 15px; font-weight: 600; font-family: var(--font-body);
      transition: background 0.15s, color 0.15s;
    }
    .p-card .add-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.2; }
    .p-card .add-btn:hover { background: color-mix(in oklch, var(--accent) 22%, transparent); }
    .p-card .add-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .p-card .add-btn.added { background: var(--accent); color: #fff; }

    .list-end {
      font-family: var(--font-mono); font-size: 11px; color: var(--muted);
      text-align: center; padding: 16px 0 20px;
    }

    /* toast */
    .toast {
      position: absolute; left: 50%; bottom: 96px;
      transform: translateX(-50%) translateY(8px);
      background: var(--fg); color: #fff;
      padding: 9px 18px; border-radius: 999px;
      font-size: 13px; font-weight: 500;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 40; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* tab bar */
    .tabbar {
      flex: 0 0 auto;
      display: grid; grid-template-columns: repeat(var(--tabs, 5), 1fr);
      padding: 8px 8px 0;
      border-top: 1px solid var(--border);
      background: color-mix(in oklch, var(--surface) 92%, transparent);
      backdrop-filter: blur(20px);
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 8px 0; color: var(--muted); font-size: 10px; letter-spacing: 0.02em;
      text-decoration: none; font-family: var(--font-body);
    }
    .tab.active { color: var(--accent); }
    .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; }
    .tab.active svg { stroke-width: 2; }
  </style>
</head>
<body>
  <!-- shared icons -->

      <span class="btn-rail right-1" aria-hidden="true"></span>
      <span class="island" aria-hidden="true"></span>

      <div class="screen">
        <div class="statusbar">
          <span class="num">9:41</span>
          <span class="right">
            <svg viewBox="0 0 17 11" aria-hidden="true">
              <rect x="0" y="7" width="3" height="4" rx="0.6"/>
              <rect x="4" y="5" width="3" height="6" rx="0.6"/>
              <rect x="8" y="3" width="3" height="8" rx="0.6"/>

            <svg viewBox="0 0 17 11" aria-hidden="true">

            </svg>
            <svg class="battery" viewBox="0 0 25 11" aria-hidden="true">
              <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/>

          </span>
        </div>

        <main class="content" data-od-id="content">
          <!-- header -->
          <div class="header" data-od-id="header">
            <button class="icon-btn" aria-label="返回">
              <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <span class="h-title">渔具商城</span>
            <div style="display:flex; gap:10px;">
              <button class="icon-btn" aria-label="搜索商品">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              </button>
              <a class="icon-btn" href="ios-cart.html" aria-label="购物车，已加入 2 件" style="position:relative; text-decoration:none; color:inherit;">
                <svg viewBox="0 0 24 24"><use href="#ic-cart"/></svg>

          <!-- promo banner -->
          <div class="promo" data-od-id="promo-banner">

          <!-- category chips -->
          <div class="filter-scroll" role="group" aria-label="商品分类筛选" data-od-id="category-filters">

          <!-- result row -->
          <div class="result-row" data-od-id="result-row">

  <script>
    // product data — 与首页商城 banner「夏季路亚竿专场」呼应
    const products = [
      { name: '碧溪路亚竿 · M调直柄', spec: '2.1m · 7-18g · 快调', cat: '路亚竿', price: 329, sold: 2100, flag: '新品' },
      { name: '竞技直柄竿 · ML调', spec: '1.98m · 4-12g · 超快调', cat: '路亚竿', price: 588, sold: 864, flag: '专场' },
      { name: '纺车轮 · 3000型浅线杯', spec: '5+1 轴承 · 4.9:1', cat: '渔轮', price: 199, sold: 3400, flag: '热销' },
      { name: '金属VIB亮片 · 7g 六件套', spec: '夜光/金色/银色 各 2', cat: '假饵', price: 45, sold: 5200, flag: '热销' },
      { name: '深潜米诺 · 9cm 悬浮款', spec: '1.2-1.8m 潜深', cat: '假饵', price: 38, sold: 1800, flag: '' },
      { name: '台钓竿 · 5.4m 超轻碳素', spec: '28调 · 98g', cat: '台钓', price: 268, sold: 1200, flag: '' },
      { name: '折叠钓椅 · 带靠背', spec: '承重 150kg · 1.9kg', cat: '台钓', price: 98, sold: 980, flag: '' },
      { name: 'PE 编织线 · 0.8 编 150m', spec: '8股 · 磨灰色', cat: '配件', price: 56, sold: 2700, flag: '' },
      { name: '钓鱼防晒衣 · UPF50+', spec: '冰感 · 连帽款', cat: '配件', price: 129, sold: 4600, flag: '热销' },
      { name: '铝合金抄网 · 2m 伸缩', spec: '网口 45cm · 无结网布', cat: '配件', price: 69, sold: 1500, flag: '' }
    ];

    const state = { cat: '全部' };
    const gridEl = document.getElementById('productGrid');
    const countEl = document.getElementById('resultCount');
    const endEl = document.getElementById('listEnd');
    const badgeEl = document.getElementById('cartBadge');
    const toastEl = document.getElementById('toast');
    let cartCount = 2;
    let toastTimer = null;

    function soldLabel(n) {
      return n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : n;
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1400);
    }

    function render() {
      const arr = products.filter(p => state.cat === '全部' || p.cat === state.cat);
      gridEl.innerHTML = '';
      arr.forEach((p, i) => {
        const card = document.createElement('div');
        card.className = 'p-card';
        card.setAttribute('data-od-id', 'product-card-' + (i + 1));
        card.innerHTML =
          '<div class="p-img">[商品图]<span class="p-flag' + (p.flag === '新品' ? ' new' : '') + '"></span></div>' +
          '<div class="p-body">' +
          '<div class="p-name"></div>' +
          '<div class="p-spec"></div>' +
          '<div class="p-foot">' +
          '<div>' +
          '<div class="p-price"><em>¥</em><span class="num"></span></div>' +
          '<div class="p-sold">已售 <span class="num"></span></div>' +
          '</div>' +
          '<button class="add-btn" aria-label="加入购物车"><svg viewBox="0 0 24 24"><use href="#ic-plus"/></svg></button>' +
          '</div>' +
          '</div>';
        card.querySelector('.p-name').textContent = p.name;
        card.querySelector('.p-spec').textContent = p.spec;
        card.querySelector('.p-price .num').textContent = p.price;
        card.querySelector('.p-sold .num').textContent = soldLabel(p.sold);
        const flagEl = card.querySelector('.p-flag');
        if (p.flag) { flagEl.textContent = p.flag; } else { flagEl.remove(); }
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');
        card.setAttribute('aria-label', '查看' + p.name + '详情');
        card.addEventListener('click', () => { window.location.href = 'ios-product-detail.html'; });
        card.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); window.location.href = 'ios-product-detail.html'; }
        });
        const btn = card.querySelector('.add-btn');
        btn.addEventListener('click', e => {
          e.stopPropagation();
          if (btn.classList.contains('added')) return;
          btn.classList.add('added');
          btn.innerHTML = '<svg viewBox="0 0 24 24"><use href="#ic-check"/></svg>';
          cartCount++;
          badgeEl.textContent = cartCount;
          showToast('已加入购物车 · ' + p.name);
        });
        gridEl.appendChild(card);
      });
      countEl.innerHTML = '共 <strong>' + arr.length + '</strong> 件商品';
      endEl.textContent = '— 已加载全部 ' + arr.length + ' 件商品 —';
    }

    // category filter
    document.querySelectorAll('.fchip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.fchip').forEach(c => c.classList.toggle('on', c === chip));
        state.cat = chip.dataset.cat;
        render();
      });
    });

    render();
  </script>
</body>
</html>
