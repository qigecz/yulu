<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>渔路 · 钓友动态列表 · iOS</title>
  <style>
    :root {
      --bg:      #f3f5f2;
      --surface: #ffffff;
      --fg:      #1a2420;
      --muted:   #647a70;
      --border:  #dce2dc;
      --accent:  #2a8f7a;

      --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
      --fg-soft:     color-mix(in oklch, var(--fg) 6%, transparent);

      --font-display: 'Iowan Old Style', 'Charter', Georgia, serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'SF Mono', Menlo, monospace;

      --fs-body: 15px;
      --fs-meta: 12px;
      --radius-card: 18px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: radial-gradient(60% 80% at 50% 0%, color-mix(in oklch, var(--accent) 6%, var(--bg)) 0%, var(--bg) 60%);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .stage { display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .caption {
      font-family: var(--font-mono); font-size: 12px;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    }
    .caption strong { color: var(--fg); font-weight: 500; }

    .device {
      position: relative; width: 390px; height: 844px;
      border-radius: 56px; padding: 12px;
      background: linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.04) inset, 0 0 0 2px #000 inset,
                  0 28px 60px -12px rgba(0,0,0,0.45), 0 8px 20px -8px rgba(0,0,0,0.35);
      isolation: isolate;
    }
    .device::before, .device::after {
      content: ''; position: absolute; width: 3px;
      background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.06) 8%, transparent 16%, transparent 84%, rgba(255,255,255,0.04) 92%, transparent 100%);
      top: 100px; bottom: 100px; pointer-events: none;
    }
    .device::before { left: -1px; }
    .device::after  { right: -1px; }
    .island {
      position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
      width: 124px; height: 36px; background: #000; border-radius: 999px; z-index: 30;
    }
    .btn-rail { position: absolute; width: 4px; background: #0a0a0c; border-radius: 2px; }
    .btn-rail.left-1  { left: -3px; top: 174px; height: 32px; }
    .btn-rail.left-2  { left: -3px; top: 220px; height: 60px; }
    .btn-rail.left-3  { left: -3px; top: 290px; height: 60px; }
    .btn-rail.right-1 { right: -3px; top: 250px; height: 100px; }

    .screen {
      position: relative; width: 100%; height: 100%;
      background: var(--bg); border-radius: 44px; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .statusbar {
      flex: 0 0 47px; padding: 18px 26px 0;
      display: flex; align-items: flex-start; justify-content: space-between;
      font-family: var(--font-body); font-size: 15px; font-weight: 600;
      color: var(--fg);
    }
    .statusbar .right { display: inline-flex; align-items: center; gap: 6px; }
    .statusbar svg { width: 17px; height: 11px; fill: var(--fg); }
    .statusbar .battery { width: 25px; }

    .content {
      flex: 1 1 auto; overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .content::-webkit-scrollbar { display: none; }

    .home-indicator { flex: 0 0 28px; position: relative; }
    .home-indicator::after {
      content: ''; position: absolute; left: 50%; bottom: 8px;
      transform: translateX(-50%); width: 134px; height: 5px;
      background: var(--fg); border-radius: 999px; opacity: 0.85;
    }

    .meta { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--muted); }
    .num  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* header */
    .header {
      padding: 8px 20px 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .header .h-title { font-family: var(--font-display); font-size: 18px; letter-spacing: -0.01em; }
    .header .icon-btn {
      width: 36px; height: 36px; border-radius: 999px;
      background: var(--surface); border: 1px solid var(--border);
      display: grid; place-items: center; color: var(--fg); cursor: pointer;
    }
    .header .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; }
    .header .icon-btn:hover { border-color: color-mix(in oklch, var(--accent) 45%, var(--border)); }
    .header .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .header .icon-btn.compose {
      background: var(--accent); border-color: transparent; color: #fff;
    }
    .header .icon-btn.compose:hover { background: color-mix(in oklch, var(--accent) 88%, #000); }

    /* filter chips */
    .filter-scroll {
      display: flex; gap: 8px; overflow-x: auto;
      padding: 6px 20px 2px;
      -webkit-overflow-scrolling: touch;
    }
    .filter-scroll::-webkit-scrollbar { display: none; }
    .fchip {
      flex-shrink: 0; padding: 7px 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 999px; font-size: 13px; color: var(--fg);
      cursor: pointer; font-family: var(--font-body);
    }
    .fchip:hover { border-color: color-mix(in oklch, var(--accent) 45%, var(--border)); }
    .fchip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .fchip.on {
      background: var(--accent); color: #fff; border-color: transparent; font-weight: 600;
    }

    /* result meta row */
    .result-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px 10px;
    }
    .result-row .r-count { font-size: 13px; color: var(--muted); }
    .result-row .r-count strong { color: var(--fg); font-weight: 600; }
    .sort-group { display: flex; gap: 4px; }
    .sort-btn {
      padding: 5px 10px; border: none; background: none;
      font-family: var(--font-body); font-size: 12px; color: var(--muted);
      cursor: pointer; border-radius: 8px;
    }
    .sort-btn:hover { background: var(--fg-soft); }
    .sort-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .sort-btn.on { color: var(--accent); font-weight: 600; background: var(--accent-soft); }

    /* feed list card */
    .feed-list { padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }
    .feed-card {
      display: block;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 14px;
      color: var(--fg); text-decoration: none;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .feed-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -8px rgba(0,0,0,0.14);
    }
    .feed-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .feed-card .f-head { display: flex; align-items: center; gap: 10px; }
    .feed-card .avatar {
      width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent-soft), var(--fg-soft)), var(--surface);
      border: 1px solid var(--border);
    }
    .feed-card .f-who { min-width: 0; }
    .feed-card .f-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .feed-card .f-badge {
      font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.05em;
      padding: 2px 7px; border-radius: 5px;
      background: var(--accent-soft); color: var(--accent);
    }
    .feed-card .f-loc { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .feed-card .f-time { margin-left: auto; font-size: 11px; color: var(--muted); flex-shrink: 0; }
    .feed-card .f-text {
      font-size: 13px; color: var(--fg); opacity: 0.85; line-height: 1.55;
      margin-top: 10px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .feed-card .f-imgs { display: flex; gap: 6px; margin-top: 10px; }
    .feed-card .f-img {
      width: 60px; height: 60px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-soft), var(--fg-soft));
      border: 1px solid var(--border);
      display: grid; place-items: center;
      color: var(--muted); font-family: var(--font-mono); font-size: 9px;
    }
    .feed-card .f-foot {
      display: flex; align-items: center; gap: 16px; margin-top: 12px;
      font-size: 12px; color: var(--muted);
      border-top: 1px solid var(--border); padding-top: 10px;
    }
    .feed-card .f-stat { display: inline-flex; align-items: center; gap: 5px; }
    .feed-card .f-stat svg { width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 1.7; }
    .feed-card .f-stat.hot { color: var(--accent); }
    .feed-card .f-stat.hot svg { stroke: var(--accent); }
    .feed-card .f-more { margin-left: auto; color: var(--accent); font-weight: 500; }

    .list-end {
      font-family: var(--font-mono); font-size: 11px; color: var(--muted);
      text-align: center; padding: 16px 0 20px;
    }

    .empty-state {
      display: none; flex-direction: column; align-items: center; gap: 8px;
      padding: 48px 20px; text-align: center;
    }
    .empty-state.show { display: flex; }
    .empty-state .e-icon {
      width: 52px; height: 52px; border-radius: 16px;
      background: var(--fg-soft);
      display: grid; place-items: center;
    }
    .empty-state .e-icon svg { width: 24px; height: 24px; stroke: var(--muted); fill: none; stroke-width: 1.6; }
    .empty-state .e-text { font-size: 14px; color: var(--muted); }

    /* tab bar */
    .tabbar {
      flex: 0 0 auto;
      display: grid; grid-template-columns: repeat(var(--tabs, 5), 1fr);
      padding: 8px 8px 0;
      border-top: 1px solid var(--border);
      background: color-mix(in oklch, var(--surface) 92%, transparent);
      backdrop-filter: blur(20px);
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 8px 0; color: var(--muted); font-size: 10px; letter-spacing: 0.02em;
      text-decoration: none; font-family: var(--font-body);
    }
    .tab.active { color: var(--accent); }
    .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; }
    .tab.active svg { stroke-width: 2; }
  </style>
</head>

  <script>
    // feed data — 与首页「钓友动态」及动态详情页数据保持一致并扩展
    const feeds = [
      {

      },

        hoursAgo: 34, loc: '千岛湖 · 南湾网箱边',

        imgs: 2, likes: 210, comments: 33
      },
      {
        author: '库钓老周', badge: '', followed: false, cat: '坑点报告',
        hoursAgo: 50, loc: '密云水库 · 湾心深坑',
        text: '湾心深坑船钓上过 12 斤青鱼，大物区名不虚传。湾口西段确实没信号，离线地图一定要提前下好。',
        imgs: 2, likes: 189, comments: 21
      },
      {
        author: '溪流路亚人', badge: '', followed: false, cat: '技巧分享',
        hoursAgo: 72, loc: '苕溪 · 古埠段',
        text: '溪流马口亮片攻略：2.5g 亮片逆流斜抛，收线略快于流速，重点搜碎石滩下游的缓水区。附标点示意。',
        imgs: 3, likes: 156, comments: 27
      },
      {
        author: '路亚老徐', badge: '', followed: false, cat: '爆护',
        hoursAgo: 120, loc: '富春江 · 七里泷',
        text: '七里泷急流礁石区鳜鱼开口，深潜米诺贴底搜礁石背面，中了 4 条，最大 51cm。防挂建议用铅头钩。',
        imgs: 2, likes: 134, comments: 15
      },
      {
        author: '筏钓阿强', badge: '', followed: false, cat: '坑点报告',
        hoursAgo: 150, loc: '新安江 · 白沙湾',
        text: '白沙湾筏钓点水位稳定，玉米打窝两小时后连上三条大鲤。筏钓路线已上传，共 4 个坑点。',
        imgs: 1, likes: 77, comments: 9
      }
    ];

    const state = { cat: '全部', sort: 'latest' };
    const sortNames = { latest: '最新', hot: '热门' };
    const listEl = document.getElementById('feedList');
    const emptyEl = document.getElementById('emptyState');
    const endEl = document.getElementById('listEnd');
    const countEl = document.getElementById('resultCount');

    function agoLabel(hours) {
      if (hours < 1) return '刚刚';
      if (hours < 24) return hours + ' 小时前';
      const days = Math.round(hours / 24);
      if (days === 1) return '昨天';
      return days + ' 天前';
    }

    function render() {
      let arr = feeds.filter(f => {
        if (state.cat === '全部') return true;
        if (state.cat === '关注') return f.followed;
        return f.cat === state.cat;
      });
      if (state.sort === 'latest') arr.sort((a, b) => a.hoursAgo - b.hoursAgo);
      if (state.sort === 'hot') arr.sort((a, b) => b.likes - a.likes);

      listEl.innerHTML = '';
      arr.forEach((f, i) => {
        const a = document.createElement('a');
        a.className = 'feed-card';
        a.href = 'ios-post-detail.html';
        a.setAttribute('data-od-id', 'feed-card-' + (i + 1));
        a.innerHTML =
          '<div class="f-head">' +
          '<div class="avatar"></div>' +
          '<div class="f-who">' +
          '<div class="f-name"><span class="f-name-t"></span><span class="f-badge"></span></div>' +
          '<div class="f-loc"></div>' +
          '</div>' +
          '<span class="f-time"></span>' +
          '</div>' +
          '<p class="f-text"></p>' +
          '<div class="f-imgs"></div>' +
          '<div class="f-foot">' +
          '<span class="f-stat' + (f.likes >= 300 ? ' hot' : '') + '"><svg viewBox="0 0 24 24"><use href="#ic-heart"/></svg><span class="num"></span></span>' +
          '<span class="f-stat"><svg viewBox="0 0 24 24"><use href="#ic-comment"/></svg><span class="num"></span></span>' +
          '<span class="f-stat"><svg viewBox="0 0 24 24"><use href="#ic-share"/></svg></span>' +
          '<span class="f-more">详情 →</span>' +
          '</div>';
        const nameEl = a.querySelector('.f-name-t');
        const badgeEl = a.querySelector('.f-badge');
        nameEl.textContent = f.author;
        if (f.cat === '爆护') { badgeEl.textContent = '爆护'; }
        else if (f.badge) { badgeEl.textContent = f.badge; }
        else { badgeEl.remove(); }
        a.querySelector('.f-loc').textContent = agoLabel(f.hoursAgo) + ' · ' + f.loc;
        a.querySelector('.f-time').textContent = f.cat;
        a.querySelector('.f-text').textContent = f.text;
        const statNums = a.querySelectorAll('.f-stat .num');
        statNums[0].textContent = f.likes;
        statNums[1].textContent = f.comments;
        const imgWrap = a.querySelector('.f-imgs');
        for (let k = 0; k < f.imgs; k++) {
          const el = document.createElement('div');
          el.className = 'f-img';
          el.textContent = '[照片]';
          imgWrap.appendChild(el);
        }
        if (f.imgs === 0) imgWrap.remove();
        listEl.appendChild(a);
      });

      const hasResults = arr.length > 0;
      emptyEl.classList.toggle('show', !hasResults);
      endEl.style.display = hasResults ? '' : 'none';
      endEl.textContent = '— 已加载全部 ' + arr.length + ' 条动态 —';
      countEl.innerHTML = '共 <strong>' + arr.length + '</strong> 条动态 · 按' + sortNames[state.sort] + '排序';
    }

    // category filter
    document.querySelectorAll('.fchip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.fchip').forEach(c => c.classList.toggle('on', c === chip));
        state.cat = chip.dataset.cat;
        render();
      });
    });

    // sort
    document.querySelectorAll('.sort-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('on', b === btn));
        state.sort = btn.dataset.sort;
        render();
      });
    });

    render();
  </script>
</body>
</html>
