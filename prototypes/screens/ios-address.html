<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>渔路 · 收货地址 · iOS</title>
  <style>
    :root {
      --bg: #f3f5f2; --surface: #ffffff; --fg: #1a2420; --muted: #647a70; --border: #dce2dc; --accent: #2a8f7a;
      --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
      --fg-soft: color-mix(in oklch, var(--fg) 6%, transparent);
      --gold: #b8860b; --danger: #b03a2e;
      --font-display: 'Iowan Old Style', 'Charter', Georgia, serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
      --radius-card: 18px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: radial-gradient(60% 80% at 50% 0%, color-mix(in oklch, var(--accent) 6%, var(--bg)) 0%, var(--bg) 60%);
      color: var(--fg); font-family: var(--font-body); font-size: 15px;
      line-height: 1.4; -webkit-font-smoothing: antialiased;
      display: grid; place-items: center; padding: 32px;
    }
    .stage { display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .caption { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .caption strong { color: var(--fg); font-weight: 500; }
    .device {
      position: relative; width: 390px; height: 844px; border-radius: 56px; padding: 12px;
      background: linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.04) inset, 0 0 0 2px #000 inset, 0 28px 60px -12px rgba(0,0,0,0.45);
      isolation: isolate;
    }
    .device::before, .device::after {
      content: ''; position: absolute; width: 3px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.06) 8%, transparent 16%, transparent 84%, rgba(255,255,255,0.04) 92%, transparent);
      top: 100px; bottom: 100px; pointer-events: none;
    }
    .device::before { left: -1px; } .device::after { right: -1px; }
    .island { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; background: #000; border-radius: 999px; z-index: 60; }
    .btn-rail { position: absolute; width: 4px; background: #0a0a0c; border-radius: 2px; }
    .btn-rail.left-1 { left: -3px; top: 174px; height: 32px; }
    .btn-rail.left-2 { left: -3px; top: 220px; height: 60px; }
    .btn-rail.left-3 { left: -3px; top: 290px; height: 60px; }
    .btn-rail.right-1 { right: -3px; top: 250px; height: 100px; }
    .screen { position: relative; width: 100%; height: 100%; background: var(--bg); border-radius: 44px; overflow: hidden; display: flex; flex-direction: column; }
    .statusbar { flex: 0 0 47px; padding: 18px 26px 0; display: flex; align-items: flex-start; justify-content: space-between; font-size: 15px; font-weight: 600; }
    .statusbar .right { display: inline-flex; align-items: center; gap: 6px; }
    .statusbar svg { width: 17px; height: 11px; fill: var(--fg); }
    .statusbar .battery { width: 25px; }
    .content { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: 90px; }
    .content::-webkit-scrollbar { display: none; }
    .home-indicator { flex: 0 0 28px; position: relative; z-index: 40; }
    .home-indicator::after { content: ''; position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); width: 134px; height: 5px; background: var(--fg); border-radius: 999px; opacity: 0.85; }
    .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    .navbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 10px; }
    .nav-side { width: 84px; display: flex; align-items: center; }
    .nav-side.right { justify-content: flex-end; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 4px;
      background: none; cursor: pointer; padding: 6px 4px 6px 0;
      color: var(--accent); font-size: 15px; font-family: var(--font-body); text-decoration: none;
    }
    .back-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
    .nav-title { font-family: var(--font-display); font-size: 17px; font-weight: 600; }
    .back-btn:focus-visible, .addr-act:focus-visible, .sheet-close:focus-visible, .f-input:focus-visible,
    .def-btn:focus-visible, .del-btn2:focus-visible, .save-btn2:focus-visible, .dlg-btn:focus-visible, .add-fab:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px;
    }

    /* address card */
    .addr {
      margin: 0 16px 10px; padding: 13px 15px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card);
    }
    .addr.is-default { border-color: color-mix(in oklch, var(--accent) 45%, var(--border)); }
    .addr-top { display: flex; align-items: center; gap: 8px; }
    .addr-name { font-size: 15px; font-weight: 600; }
    .addr-tel { font-size: 13px; color: var(--muted); font-family: var(--font-mono); }
    .def-badge {
      font-size: 10px; font-weight: 600; color: #fff; background: var(--accent);
      border-radius: 999px; padding: 1.5px 8px;
    }
    .addr-text { font-size: 13px; line-height: 1.55; margin: 6px 0 0; color: color-mix(in oklch, var(--fg) 88%, var(--muted)); }
    .addr-acts { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
    .addr-act {
      background: none; border: none; cursor: pointer; padding: 4px 8px;
      font-size: 12px; color: var(--accent); font-family: var(--font-body); font-weight: 500;
    }
    .addr-act.danger { color: var(--danger); }
    .addr-act:hover { text-decoration: underline; }

    .add-fab {
      position: absolute; left: 16px; right: 16px; bottom: 40px; z-index: 35;
      min-height: 48px; border-radius: 15px; border: none; cursor: pointer;
      background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; font-family: var(--font-body);
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .add-fab:hover { background: color-mix(in oklch, var(--accent) 92%, #000); }
    .add-fab svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 2.2; }

    /* empty */
    .empty { margin: 60px 40px; text-align: center; }
    .empty svg { width: 60px; height: 60px; stroke: var(--border); fill: none; stroke-width: 1.4; }
    .empty p { font-size: 14px; color: var(--muted); margin: 12px 0 0; }

    /* editor sheet */
    .sheet-scrim {
      position: absolute; inset: 0; z-index: 45;
      background: rgba(10, 14, 12, 0.4);
      opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .sheet-scrim.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 50;
      background: var(--surface);
      border-radius: 22px 22px 0 0; border-top: 1px solid var(--border);
      box-shadow: 0 -8px 30px -12px rgba(0,0,0,0.18);
      padding: 8px 0 16px;
      transform: translateY(105%); transition: transform 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
      max-height: 82%;
    }
    .sheet.open { transform: translateY(0); }
    .sheet-handle { width: 36px; height: 4px; border-radius: 999px; background: var(--border); margin: 0 auto 8px; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 0 16px 6px; }
    .sheet-head .s-title { font-family: var(--font-display); font-size: 17px; font-weight: 600; }
    .sheet-close {
      width: 30px; height: 30px; border-radius: 999px; cursor: pointer;
      background: var(--fg-soft); border: none; color: var(--fg);
      display: grid; place-items: center;
    }
    .sheet-close svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
    .sheet-body { padding: 0 16px; display: flex; flex-direction: column; gap: 12px; }
    .f-label { font-size: 12px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; }
    .f-label .req { color: var(--accent); }
    .f-input {
      width: 100%; min-height: 44px; padding: 10px 12px;
      border: 1px solid var(--border); border-radius: 12px;
      background: var(--bg); font-family: var(--font-body); font-size: 14px; color: var(--fg);
    }
    .f-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .f-input.bad { border-color: #b03a2e; }
    .f-err { display: none; font-size: 11px; color: #b03a2e; margin-top: 3px; }
    .f-err.show { display: block; }
    .save-btn2 {
      min-height: 46px; border-radius: 14px; border: none; cursor: pointer;
      background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; font-family: var(--font-body);
    }
    .save-btn2:hover { background: color-mix(in oklch, var(--accent) 92%, #000); }

    /* delete dialog */
    dialog.confirm {
      border: none; border-radius: 18px; padding: 0; width: 272px;
      background: var(--surface); box-shadow: 0 18px 50px -12px rgba(0,0,0,0.35);
      color: var(--fg); font-family: var(--font-body);
    }
    dialog.confirm::backdrop { background: rgba(10, 14, 12, 0.45); }
    .dlg-body { padding: 20px 18px 14px; text-align: center; }
    .dlg-title { font-size: 16px; font-weight: 600; margin: 0; }
    .dlg-text { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
    .dlg-btns { display: flex; border-top: 1px solid var(--border); }
    .dlg-btn { flex: 1; padding: 13px 0; background: none; border: none; cursor: pointer; font-size: 15px; color: var(--muted); font-family: var(--font-body); }
    .dlg-btn + .dlg-btn { border-left: 1px solid var(--border); }
    .dlg-btn.danger { color: var(--danger); font-weight: 600; }

    /* toast */
    .toast {
      position: absolute; left: 50%; bottom: 110px; z-index: 55;
      transform: translate(-50%, 16px);
      background: var(--fg); color: #fff; padding: 10px 18px; border-radius: 999px;
      font-size: 13px; box-shadow: 0 6px 20px -6px rgba(0,0,0,0.4);
      opacity: 0; pointer-events: none; transition: all 0.3s;
      display: flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast svg { width: 14px; height: 14px; stroke: #7dd8c3; fill: none; stroke-width: 2.2; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="caption"><strong>渔路</strong> · iOS · 收货地址</div>
    <div class="device" data-od-id="device">
      <span class="btn-rail left-1" aria-hidden></span>
      <span class="btn-rail left-2" aria-hidden></span>
      <span class="btn-rail left-3" aria-hidden></span>
      <span class="btn-rail right-1" aria-hidden></span>
      <span class="island" aria-hidden></span>
      <div class="screen">
        <div class="statusbar">
          <span class="num">9:41</span>
          <span class="right">
            <svg viewBox="0 0 17 11" aria-hidden><rect x="0" y="7" width="3" height="4" rx="0.6"/><rect x="4" y="5" width="3" height="6" rx="0.6"/><rect x="8" y="3" width="3" height="8" rx="0.6"/><rect x="12" y="0" width="3" height="11" rx="0.6"/></svg>
            <svg viewBox="0 0 17 11" aria-hidden><path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6L5 9.1c1-0.9 2.2-1.4 3.5-1.4 1.3 0 2.5 0.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6 0.7-5 2zM6.5 10.6l2 2 2-2c-0.5-0.5-1.2-0.8-2-0.8s-1.5 0.3-2 0.8z"/></svg>
            <svg class="battery" viewBox="0 0 25 11" aria-hidden><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/><rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="currentColor" fill-opacity="0.45"/><rect x="2" y="2" width="18" height="7" rx="1.4"/></svg>
          </span>
        </div>

        <main class="content" data-od-id="content">
          <div class="navbar" data-od-id="address-navbar">
            <span class="nav-side">
              <a class="back-btn" href="ios-orders.html">
                <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>订单
              </a>
            </span>
            <span class="nav-title">收货地址</span>
            <span class="nav-side right"></span>
          </div>

          <div id="addrList" data-od-id="address-list"></div>

          <div class="empty" id="addrEmpty" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <p>还没有收货地址，添加一个方便渔具到家</p>
          </div>

          <div style="height: 24px;"></div>
        </main>

        <!-- 新增按钮 -->
        <button class="add-fab" id="addBtn" type="button">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          新增收货地址
        </button>

        <!-- 编辑抽屉 -->
        <div class="sheet-scrim" id="scrim" aria-hidden="true"></div>
        <div class="sheet" id="editSheet" data-od-id="address-editor" role="dialog" aria-label="编辑收货地址">
          <div class="sheet-handle" aria-hidden="true"></div>
          <div class="sheet-head">
            <span class="s-title" id="sheetTitle">新增收货地址</span>
            <button class="sheet-close" id="sheetClose" type="button" aria-label="关闭地址编辑">
              <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>
          <div class="sheet-body">
            <div>
              <p class="f-label" style="margin:0 0 6px;"><span>联系人 <span class="req">*</span></span></p>
              <input class="f-input" id="fName" type="text" maxlength="10" placeholder="收件人姓名" />
              <p class="f-err" id="errName">请填写联系人姓名</p>
            </div>
            <div>
              <p class="f-label" style="margin:0 0 6px;"><span>手机号 <span class="req">*</span></span></p>
              <input class="f-input num" id="fTel" type="tel" maxlength="11" placeholder="11 位手机号码" />
              <p class="f-err" id="errTel">手机号应为 11 位数字，请检查后重填</p>
            </div>
            <div>
              <p class="f-label" style="margin:0 0 6px;"><span>所在地区 <span class="req">*</span></span></p>
              <input class="f-input" id="fRegion" type="text" maxlength="20" placeholder="省 / 市 / 区" />
              <p class="f-err" id="errRegion">请填写省市区</p>
            </div>
            <div>
              <p class="f-label" style="margin:0 0 6px;"><span>详细地址 <span class="req">*</span></span></p>
              <input class="f-input" id="fDetail" type="text" maxlength="40" placeholder="街道、门牌号、附近标志物" />
              <p class="f-err" id="errDetail">请填写详细地址，方便骑手找到你</p>
            </div>
            <button class="save-btn2" id="saveAddr" type="button">保存地址</button>
          </div>
        </div>

        <!-- 删除确认 -->
        <dialog class="confirm" id="delDlg" data-od-id="delete-dialog">
          <div class="dlg-body">
            <p class="dlg-title">删除这个地址？</p>
            <p class="dlg-text" id="delText">删除后不可恢复。</p>
          </div>
          <div class="dlg-btns">
            <button class="dlg-btn" id="delCancel" type="button">取消</button>
            <button class="dlg-btn danger" id="delOk" type="button">删除</button>
          </div>
        </dialog>

        <!-- toast -->
        <div class="toast" id="toast" role="status">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          <span id="toastText">已保存</span>
        </div>

        <div class="home-indicator" aria-hidden></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var ADDRS = [
        { id: 1, name: '路亚阿杰', tel: '13857666688', region: '浙江省 杭州市 滨江区', detail: '江南大道 588 号滨江钓具城 3 幢 210 室', def: true },
        { id: 2, name: '路亚阿杰', tel: '13857666688', region: '浙江省 杭州市 淳安县', detail: '千岛湖镇秀水街 76 号（湖畔驿站代收）', def: false }
      ];

      var listEl = document.getElementById('addrList');
      var emptyEl = document.getElementById('addrEmpty');
      var addBtn = document.getElementById('addBtn');
      var scrim = document.getElementById('scrim');
      var sheet = document.getElementById('editSheet');
      var delDlg = document.getElementById('delDlg');
      var toast = document.getElementById('toast');
      var toastText = document.getElementById('toastText');
      var toastTimer = null;
      var editingId = null; // null = 新增
      var deletingId = null;

      function showToast(msg) {
        toastText.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1800);
      }
      function maskTel(t) { return t.slice(0, 3) + '****' + t.slice(7); }

      function render() {
        listEl.innerHTML = '';
        ADDRS.forEach(function (a) {
          var card = document.createElement('div');
          card.className = 'addr' + (a.def ? ' is-default' : '');
          card.innerHTML =
            '<div class="addr-top">' +
              '<span class="addr-name"></span>' +
              '<span class="addr-tel num"></span>' +
              (a.def ? '<span class="def-badge">默认</span>' : '') +
            '</div>' +
            '<p class="addr-text"></p>' +
            '<div class="addr-acts"></div>';
          card.querySelector('.addr-name').textContent = a.name;
          card.querySelector('.addr-tel').textContent = maskTel(a.tel);
          card.querySelector('.addr-text').textContent = a.region + ' · ' + a.detail;

          var acts = card.querySelector('.addr-acts');
          if (!a.def) {
            var defB = document.createElement('button');
            defB.className = 'addr-act'; defB.type = 'button'; defB.textContent = '设为默认';
            defB.addEventListener('click', function () {
              ADDRS.forEach(function (x) { x.def = x.id === a.id; });
              showToast('已设为默认地址');
              render();
            });
            acts.appendChild(defB);
          }
          var editB = document.createElement('button');
          editB.className = 'addr-act'; editB.type = 'button'; editB.textContent = '编辑';
          editB.addEventListener('click', function () { openEditor(a); });
          var delB = document.createElement('button');
          delB.className = 'addr-act danger'; delB.type = 'button'; delB.textContent = '删除';
          delB.addEventListener('click', function () {
            deletingId = a.id;
            document.getElementById('delText').textContent =
              '将删除「' + a.region + ' · ' + a.detail.slice(0, 12) + '…」，删除后不可恢复。';
            delDlg.showModal();
          });
          acts.append(editB, delB);
          listEl.appendChild(card);
        });
        emptyEl.hidden = ADDRS.length !== 0;
      }

      /* 编辑器 */
      var F = { name: 'fName', tel: 'fTel', region: 'fRegion', detail: 'fDetail' };
      var E = { name: 'errName', tel: 'errTel', region: 'errRegion', detail: 'errDetail' };
      function field(k) { return document.getElementById(F[k]); }
      function errOf(k) { return document.getElementById(E[k]); }

      function openEditor(a) {
        editingId = a ? a.id : null;
        document.getElementById('sheetTitle').textContent = a ? '编辑收货地址' : '新增收货地址';
        Object.keys(F).forEach(function (k) {
          field(k).value = a ? a[k === 'detail' ? 'detail' : k] : '';
          field(k).classList.remove('bad');
          errOf(k).classList.remove('show');
        });
        sheet.classList.add('open');
        scrim.classList.add('open');
        setTimeout(function () { field('name').focus(); }, 320);
      }
      function closeEditor() {
        sheet.classList.remove('open');
        scrim.classList.remove('open');
        addBtn.focus();
      }
      addBtn.addEventListener('click', function () { openEditor(null); });
      document.getElementById('sheetClose').addEventListener('click', closeEditor);
      scrim.addEventListener('click', closeEditor);

      function validate() {
        var ok = true;
        Object.keys(F).forEach(function (k) {
          var v = field(k).value.trim();
          var bad = !v || (k === 'tel' && !/^1\d{10}$/.test(v));
          field(k).classList.toggle('bad', bad);
          errOf(k).classList.toggle('show', bad);
          if (bad) ok = false;
        });
        return ok;
      }
      Object.keys(F).forEach(function (k) {
        field(k).addEventListener('blur', function () {
          var v = field(k).value.trim();
          if (v === '') return; // 空值留给提交时统一提示
          var bad = (k === 'tel' && !/^1\d{10}$/.test(v));
          field(k).classList.toggle('bad', bad);
          errOf(k).classList.toggle('show', bad);
        });
      });

      document.getElementById('saveAddr').addEventListener('click', function () {
        if (!validate()) {
          var firstBad = ['name', 'tel', 'region', 'detail'].find(function (k) { return errOf(k).classList.contains('show'); });
          if (firstBad) field(firstBad).focus();
          return;
        }
        if (editingId === null) {
          var maxId = ADDRS.reduce(function (m, x) { return Math.max(m, x.id); }, 0);
          ADDRS.push({
            id: maxId + 1,
            name: field('name').value.trim(),
            tel: field('tel').value.trim(),
            region: field('region').value.trim(),
            detail: field('detail').value.trim(),
            def: ADDRS.length === 0
          });
          showToast(ADDRS.length === 1 ? '已保存并设为默认地址' : '新增地址成功');
        } else {
          var a = ADDRS.find(function (x) { return x.id === editingId; });
          a.name = field('name').value.trim();
          a.tel = field('tel').value.trim();
          a.region = field('region').value.trim();
          a.detail = field('detail').value.trim();
          showToast('地址已更新');
        }
        closeEditor();
        render();
      });

      /* 删除 */
      document.getElementById('delCancel').addEventListener('click', function () { delDlg.close(); });
      document.getElementById('delOk').addEventListener('click', function () {
        var idx = ADDRS.findIndex(function (x) { return x.id === deletingId; });
        var wasDef = ADDRS[idx] && ADDRS[idx].def;
        ADDRS.splice(idx, 1);
        if (wasDef && ADDRS.length) ADDRS[0].def = true;
        delDlg.close();
        showToast('地址已删除');
        render();
      });
      delDlg.addEventListener('cancel', function (e) { e.preventDefault(); delDlg.close(); });

      render();
    })();
  </script>
</body>
</html>
