<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>渔路 · 编辑资料 · iOS</title>
  <style>
    :root {
      --bg: #f3f5f2; --surface: #ffffff; --fg: #1a2420; --muted: #647a70; --border: #dce2dc; --accent: #2a8f7a;
      --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
      --fg-soft: color-mix(in oklch, var(--fg) 6%, transparent);
      --gold: #b8860b;
      --font-display: 'Iowan Old Style', 'Charter', Georgia, serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
      --radius-card: 18px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: radial-gradient(60% 80% at 50% 0%, color-mix(in oklch, var(--accent) 6%, var(--bg)) 0%, var(--bg) 60%);
      color: var(--fg); font-family: var(--font-body); font-size: 15px;
      line-height: 1.4; -webkit-font-smoothing: antialiased;
      display: grid; place-items: center; padding: 32px;
    }
    .stage { display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .caption { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .caption strong { color: var(--fg); font-weight: 500; }
    .device {
      position: relative; width: 390px; height: 844px; border-radius: 56px; padding: 12px;
      background: linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.04) inset, 0 0 0 2px #000 inset, 0 28px 60px -12px rgba(0,0,0,0.45);
      isolation: isolate;
    }
    .device::before, .device::after {
      content: ''; position: absolute; width: 3px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.06) 8%, transparent 16%, transparent 84%, rgba(255,255,255,0.04) 92%, transparent);
      top: 100px; bottom: 100px; pointer-events: none;
    }
    .device::before { left: -1px; } .device::after { right: -1px; }
    .island { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; background: #000; border-radius: 999px; z-index: 60; }
    .btn-rail { position: absolute; width: 4px; background: #0a0a0c; border-radius: 2px; }
    .btn-rail.left-1 { left: -3px; top: 174px; height: 32px; }
    .btn-rail.left-2 { left: -3px; top: 220px; height: 60px; }
    .btn-rail.left-3 { left: -3px; top: 290px; height: 60px; }
    .btn-rail.right-1 { right: -3px; top: 250px; height: 100px; }
    .screen { position: relative; width: 100%; height: 100%; background: var(--bg); border-radius: 44px; overflow: hidden; display: flex; flex-direction: column; }
    .statusbar { flex: 0 0 47px; padding: 18px 26px 0; display: flex; align-items: flex-start; justify-content: space-between; font-size: 15px; font-weight: 600; }
    .statusbar .right { display: inline-flex; align-items: center; gap: 6px; }
    .statusbar svg { width: 17px; height: 11px; fill: var(--fg); }
    .statusbar .battery { width: 25px; }
    .content { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
    .content::-webkit-scrollbar { display: none; }
    .home-indicator { flex: 0 0 28px; position: relative; z-index: 40; }
    .home-indicator::after { content: ''; position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); width: 134px; height: 5px; background: var(--fg); border-radius: 999px; opacity: 0.85; }
    .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* nav bar */
    .navbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px 10px;
    }
    .nav-side { width: 74px; display: flex; align-items: center; }
    .nav-side.right { justify-content: flex-end; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 4px;
      background: none; border: none; cursor: pointer; padding: 6px 4px 6px 0;
      color: var(--accent); font-size: 15px; font-family: var(--font-body);
    }
    .back-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
    .back-btn:focus-visible, .save-btn:focus-visible, .avatar-edit:focus-visible, .loc-row:focus-visible,
    .sheet-action:focus-visible, .seg-btn:focus-visible, .chip:focus-visible, .dlg-btn:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px;
    }
    .nav-title { font-family: var(--font-display); font-size: 17px; font-weight: 600; }
    .save-btn {
      width: 74px; min-height: 34px; border-radius: 999px; border: none; cursor: pointer;
      background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; font-family: var(--font-body);
    }
    .save-btn:hover { background: color-mix(in oklch, var(--accent) 92%, #000); }
    .save-btn[disabled] { background: var(--border); color: var(--muted); cursor: default; }
    .save-btn .spinner {
      width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px;
      border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff;
      animation: spin 0.7s linear infinite; display: inline-block; margin-right: 5px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* error summary */
    .err-summary {
      display: none; margin: 0 20px 4px; padding: 9px 12px;
      border-radius: 12px; background: #fbeae7; color: #8c2f24; font-size: 12px;
    }
    .err-summary.show { display: block; }
    .err-summary a { color: #8c2f24; font-weight: 600; }

    /* avatar card */
    .avatar-card {
      margin: 6px 20px 0; padding: 16px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card);
      display: flex; align-items: center; gap: 14px;
    }
    .avatar-lg {
      width: 68px; height: 68px; border-radius: 50%; flex-shrink: 0;
      background: var(--accent-soft);
      display: grid; place-items: center;
      font-family: var(--font-display); font-size: 28px; font-weight: 600; color: var(--accent);
      overflow: hidden;
    }
    .avatar-lg.photo {
      background:
        radial-gradient(60% 60% at 30% 25%, color-mix(in oklch, var(--accent) 40%, var(--surface)) 0%, transparent 60%),
        linear-gradient(150deg, color-mix(in oklch, var(--accent) 24%, var(--surface)), color-mix(in oklch, var(--fg) 14%, var(--surface)));
      color: transparent;
    }
    .avatar-lg svg { width: 30px; height: 30px; stroke: #fff; fill: none; stroke-width: 1.6; opacity: 0.9; }
    .avatar-edit {
      margin-left: auto; flex-shrink: 0;
      padding: 7px 14px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--border); background: var(--bg);
      font-size: 12px; color: var(--fg); font-family: var(--font-body);
    }
    .avatar-hint { font-size: 11px; color: var(--muted); margin: 3px 0 0; }

    /* form groups */
    .group-label { margin: 18px 20px 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
    .form-card { margin: 0 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 4px 16px; }
    .field { padding: 11px 0; border-top: 1px solid var(--border); }
    .field:first-child { border-top: 0; }
    .field-label { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
    .field-label .req { color: var(--accent); }
    .field-label .count { font-family: var(--font-mono); font-weight: 400; color: var(--muted); }
    .field input[type="text"], .field textarea {
      width: 100%; border: none; background: none; padding: 0;
      font-family: var(--font-body); font-size: 15px; color: var(--fg);
      line-height: 1.5; resize: none;
    }
    .field input:focus, .field textarea:focus { outline: none; }
    .field.err-box input { color: #8c2f24; }
    .field-err { display: none; font-size: 11px; color: #b03a2e; margin-top: 5px; }
    .field-err.show { display: block; }

    .loc-row {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      background: none; border: none; cursor: pointer; padding: 0;
      font-family: var(--font-body); font-size: 15px; color: var(--fg); text-align: left;
    }
    .loc-row .chev { color: var(--muted); font-size: 15px; }

    .seg { display: flex; background: var(--fg-soft); border-radius: 999px; padding: 2px; }
    .seg-btn {
      flex: 1; border: none; background: none; cursor: pointer;
      padding: 7px 0; border-radius: 999px;
      font-size: 12px; color: var(--muted); font-family: var(--font-body);
    }
    .seg-btn.active { background: var(--fg); color: #fff; font-weight: 600; }

    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip {
      padding: 6px 13px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--border); background: var(--bg);
      font-size: 12px; color: var(--fg); font-family: var(--font-body);
    }
    .chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

    .badge-row {
      margin: 0 20px; padding: 12px 16px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card);
      display: flex; align-items: center; gap: 10px;
    }
    .badge-medal {
      width: 34px; height: 34px; border-radius: 50%;
      background: color-mix(in oklch, var(--gold) 14%, transparent);
      display: grid; place-items: center;
    }
    .badge-medal svg { width: 16px; height: 16px; fill: var(--gold); }
    .badge-name { font-size: 14px; font-weight: 600; color: var(--gold); }
    .badge-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

    /* bottom sheets */
    .sheet-scrim {
      position: absolute; inset: 0; z-index: 45;
      background: rgba(10, 14, 12, 0.4);
      opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .sheet-scrim.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 50;
      background: var(--surface);
      border-radius: 22px 22px 0 0;
      border-top: 1px solid var(--border);
      box-shadow: 0 -8px 30px -12px rgba(0,0,0,0.18);
      padding: 8px 0 16px;
      transform: translateY(105%); transition: transform 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    .sheet.open { transform: translateY(0); }
    .sheet-handle { width: 36px; height: 4px; border-radius: 999px; background: var(--border); margin: 0 auto 10px; }
    .sheet-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; padding: 0 20px 8px; }
    .sheet-action {
      width: 100%; display: flex; align-items: center; gap: 10px;
      background: none; border: none; border-top: 1px solid var(--border);
      padding: 14px 20px; cursor: pointer;
      font-family: var(--font-body); font-size: 15px; color: var(--fg); text-align: left;
    }
    .sheet-action svg { width: 18px; height: 18px; stroke: var(--accent); fill: none; stroke-width: 1.7; }
    .sheet-action:last-child { color: var(--muted); }
    .sheet-action:last-child svg { stroke: var(--muted); }
    .sheet-chips { display: flex; flex-direction: column; gap: 0; }
    .loc-opt {
      width: 100%; background: none; border: none; border-top: 1px solid var(--border);
      padding: 14px 20px; cursor: pointer; text-align: left;
      font-family: var(--font-body); font-size: 15px; color: var(--fg);
      display: flex; justify-content: space-between; align-items: center;
    }
    .loc-opt .tick { color: var(--accent); font-weight: 700; visibility: hidden; }
    .loc-opt.active .tick { visibility: visible; }
    .loc-opt.active { color: var(--accent); font-weight: 600; }

    /* discard dialog */
    dialog.discard {
      border: none; border-radius: 18px; padding: 0;
      width: 280px; background: var(--surface);
      box-shadow: 0 18px 50px -12px rgba(0,0,0,0.35);
      color: var(--fg); font-family: var(--font-body);
    }
    dialog.discard::backdrop { background: rgba(10, 14, 12, 0.45); }
    .dlg-body { padding: 20px 18px 14px; text-align: center; }
    .dlg-title { font-size: 16px; font-weight: 600; }
    .dlg-text { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
    .dlg-btns { display: flex; border-top: 1px solid var(--border); }
    .dlg-btn {
      flex: 1; padding: 13px 0; background: none; border: none; cursor: pointer;
      font-family: var(--font-body); font-size: 15px; color: var(--muted);
    }
    .dlg-btn + .dlg-btn { border-left: 1px solid var(--border); color: var(--accent); font-weight: 600; }

    /* toast */
    .toast {
      position: absolute; left: 50%; bottom: 90px; z-index: 55;
      transform: translate(-50%, 16px);
      background: var(--fg); color: #fff;
      padding: 10px 18px; border-radius: 999px;
      font-size: 13px; box-shadow: 0 6px 20px -6px rgba(0,0,0,0.4);
      opacity: 0; pointer-events: none; transition: all 0.3s;
      display: flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast svg { width: 14px; height: 14px; stroke: #7dd8c3; fill: none; stroke-width: 2.2; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="caption"><strong>渔路</strong> · iOS · 编辑资料</div>
    <div class="device" data-od-id="device">
      <span class="btn-rail left-1" aria-hidden></span>
      <span class="btn-rail left-2" aria-hidden></span>
      <span class="btn-rail left-3" aria-hidden></span>
      <span class="btn-rail right-1" aria-hidden></span>
      <span class="island" aria-hidden></span>
      <div class="screen">
        <div class="statusbar">
          <span class="num">9:41</span>
          <span class="right">
            <svg viewBox="0 0 17 11" aria-hidden><rect x="0" y="7" width="3" height="4" rx="0.6"/><rect x="4" y="5" width="3" height="6" rx="0.6"/><rect x="8" y="3" width="3" height="8" rx="0.6"/><rect x="12" y="0" width="3" height="11" rx="0.6"/></svg>
            <svg viewBox="0 0 17 11" aria-hidden><path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6L5 9.1c1-0.9 2.2-1.4 3.5-1.4 1.3 0 2.5 0.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6 0.7-5 2zM6.5 10.6l2 2 2-2c-0.5-0.5-1.2-0.8-2-0.8s-1.5 0.3-2 0.8z"/></svg>
            <svg class="battery" viewBox="0 0 25 11" aria-hidden><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/><rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="currentColor" fill-opacity="0.45"/><rect x="2" y="2" width="18" height="7" rx="1.4"/></svg>
          </span>
        </div>

        <main class="content" data-od-id="content">
          <div class="navbar" data-od-id="edit-navbar">
            <span class="nav-side">
              <button class="back-btn" id="backBtn" type="button" aria-label="返回我的页面">
                <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>我的
              </button>
            </span>
            <span class="nav-title">编辑资料</span>
            <span class="nav-side right">
              <button class="save-btn" id="saveBtn" type="button" disabled>保存</button>
            </span>
          </div>

          <div class="err-summary" id="errSummary" role="alert">
            还有 <a href="#nickField" id="errLink">1 处问题</a> 需要修正后才能保存
          </div>

          <!-- avatar -->
          <div class="avatar-card" data-od-id="avatar-card">
            <div class="avatar-lg" id="avatarLg" aria-hidden="true">杰</div>
            <div>
              <p style="margin:0; font-size:14px; font-weight:600;">路亚阿杰</p>
              <p class="avatar-hint" id="avatarHint">支持 JPG / PNG，原型中以占位图示意</p>
            </div>
            <button class="avatar-edit" id="avatarEdit" type="button">更换头像</button>
          </div>

          <!-- basic info -->
          <p class="group-label">基本信息</p>
          <div class="form-card" data-od-id="basic-info">
            <div class="field" id="nickField">
              <div class="field-label"><span>昵称 <span class="req">*</span></span></div>
              <input type="text" id="nickInput" maxlength="12" value="路亚阿杰" autocomplete="off" />
              <p class="field-err" id="nickErr">昵称不能为空，给自己起个钓友都认识的名字吧（2–12 字）</p>
            </div>
            <div class="field">
              <div class="field-label"><span>个性签名</span><span class="count"><span id="sigNum">14</span> / 50</span></div>
              <textarea id="sigInput" rows="2" maxlength="50">主攻鲈鱼翘嘴，周末常驻千岛湖</textarea>
            </div>
            <div class="field">
              <div class="field-label"><span>所在地</span></div>
              <button class="loc-row" id="locRow" type="button">
                <span id="locText">浙江 · 千岛湖</span>
                <span class="chev">›</span>
              </button>
            </div>
          </div>

          <!-- fishing profile -->
          <p class="group-label">钓鱼资料</p>
          <div class="form-card" data-od-id="fishing-info">
            <div class="field">
              <div class="field-label"><span>钓龄</span></div>
              <div class="seg" id="expSeg" role="group" aria-label="钓龄">
                <button class="seg-btn" type="button" data-v="lt1">1年内</button>
                <button class="seg-btn" type="button" data-v="1to3">1–3年</button>
                <button class="seg-btn active" type="button" data-v="3to5">3–5年</button>
                <button class="seg-btn" type="button" data-v="gt5">5年以上</button>
              </div>
            </div>
            <div class="field">
              <div class="field-label"><span>常用钓法</span></div>
              <div class="chips" id="methodChips">
                <button class="chip active" type="button">路亚</button>
                <button class="chip" type="button">台钓</button>
                <button class="chip" type="button">筏钓</button>
              </div>
            </div>
            <div class="field">
              <div class="field-label"><span>主打鱼种</span></div>
              <div class="chips" id="fishChips">
                <button class="chip active" type="button">鲈鱼</button>
                <button class="chip active" type="button">翘嘴</button>
                <button class="chip" type="button">鳜鱼</button>
              </div>
            </div>
          </div>

          <!-- badge -->
          <p class="group-label">荣誉徽章</p>
          <div class="badge-row" data-od-id="badge-row">
            <span class="badge-medal"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26"/></svg></span>
            <div>
              <p class="badge-name" style="margin:0;">金牌探路者</p>
              <p class="badge-sub">2025 年度坑点路线贡献 TOP 50，由平台颁发</p>
            </div>
          </div>

          <div style="height: 24px;"></div>
        </main>

        <!-- avatar sheet -->
        <div class="sheet-scrim" id="scrim" aria-hidden="true"></div>
        <div class="sheet" id="avatarSheet" data-od-id="avatar-sheet" role="dialog" aria-label="更换头像">
          <div class="sheet-handle" aria-hidden="true"></div>
          <p class="sheet-title" style="margin:0;">更换头像</p>
          <button class="sheet-action" type="button" data-src="camera">
            <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            拍一张
          </button>
          <button class="sheet-action" type="button" data-src="album">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            从相册选择
          </button>
          <button class="sheet-action" type="button" data-src="keep">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            保留当前头像
          </button>
        </div>

        <!-- location sheet -->
        <div class="sheet" id="locSheet" data-od-id="location-sheet" role="dialog" aria-label="选择所在地" hidden>
          <div class="sheet-handle" aria-hidden="true"></div>
          <p class="sheet-title" style="margin:0;">所在地</p>
          <button class="loc-opt active" type="button" data-loc="浙江 · 千岛湖">浙江 · 千岛湖 <span class="tick">✓</span></button>
          <button class="loc-opt" type="button" data-loc="浙江 · 杭州">浙江 · 杭州 <span class="tick">✓</span></button>
          <button class="loc-opt" type="button" data-loc="江苏 · 苏州">江苏 · 苏州 <span class="tick">✓</span></button>
          <button class="loc-opt" type="button" data-loc="北京 · 密云">北京 · 密云 <span class="tick">✓</span></button>
        </div>

        <!-- discard dialog -->
        <dialog class="discard" id="discardDlg" data-od-id="discard-dialog">
          <div class="dlg-body">
            <p class="dlg-title" style="margin:0;">放弃修改？</p>
            <p class="dlg-text">你的资料改动还没有保存，离开后将丢失。</p>
          </div>
          <div class="dlg-btns">
            <button class="dlg-btn" id="dlgStay" type="button">继续编辑</button>
            <button class="dlg-btn" id="dlgLeave" type="button">放弃修改</button>
          </div>
        </dialog>

        <!-- toast -->
        <div class="toast" id="toast" role="status">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          <span id="toastText">已保存</span>
        </div>

        <div class="home-indicator" aria-hidden></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var avatarLg = document.getElementById('avatarLg');
      var avatarHint = document.getElementById('avatarHint');
      var scrim = document.getElementById('scrim');
      var avatarSheet = document.getElementById('avatarSheet');
      var locSheet = document.getElementById('locSheet');
      var locRow = document.getElementById('locRow');
      var locText = document.getElementById('locText');
      var nickInput = document.getElementById('nickInput');
      var nickErr = document.getElementById('nickErr');
      var nickField = document.getElementById('nickField');
      var errSummary = document.getElementById('errSummary');
      var sigInput = document.getElementById('sigInput');
      var sigNum = document.getElementById('sigNum');
      var saveBtn = document.getElementById('saveBtn');
      var backBtn = document.getElementById('backBtn');
      var discardDlg = document.getElementById('discardDlg');
      var toast = document.getElementById('toast');
      var toastText = document.getElementById('toastText');
      var dirty = false;
      var submitting = false;
      var activeSheet = null;

      function markDirty() {
        dirty = true;
        if (!submitting) saveBtn.disabled = false;
      }

      function showToast(msg, after) {
        toastText.textContent = msg;
        toast.classList.add('show');
        setTimeout(function () {
          toast.classList.remove('show');
          if (after) after();
        }, 1000);
      }

      /* ── sheets ── */
      function openSheet(sheet) {
        if (activeSheet) activeSheet.classList.remove('open');
        sheet.hidden = false;
        // 双 rAF 保证先解除 hidden 再做位移动画
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { sheet.classList.add('open'); });
        });
        scrim.classList.add('open');
        activeSheet = sheet;
      }
      function closeSheet() {
        if (activeSheet) activeSheet.classList.remove('open');
        scrim.classList.remove('open');
        activeSheet = null;
      }
      scrim.addEventListener('click', closeSheet);

      /* ── avatar ── */
      document.getElementById('avatarEdit').addEventListener('click', function () {
        openSheet(avatarSheet);
      });
      avatarSheet.querySelectorAll('.sheet-action').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var src = btn.getAttribute('data-src');
          closeSheet();
          if (src === 'keep') {
            avatarLg.classList.remove('photo');
            avatarLg.textContent = '杰';
            avatarHint.textContent = '已保留当前头像';
          } else {
            avatarLg.classList.add('photo');
            avatarLg.textContent = '';
            avatarLg.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
            avatarHint.textContent = src === 'camera' ? '已使用新拍的照片（原型占位）' : '已使用相册照片（原型占位）';
            markDirty();
          }
          showToast(src === 'keep' ? '已保留当前头像' : '头像已更新');
        });
      });

      /* ── location ── */
      locRow.addEventListener('click', function () { openSheet(locSheet); });
      locSheet.querySelectorAll('.loc-opt').forEach(function (opt) {
        opt.addEventListener('click', function () {
          var v = opt.getAttribute('data-loc');
          locSheet.querySelectorAll('.loc-opt').forEach(function (o) { o.classList.remove('active'); });
          opt.classList.add('active');
          if (v !== locText.textContent) markDirty();
          locText.textContent = v;
          closeSheet();
        });
      });

      /* ── nickname validation（blur 时校验，不在每次按键时打断）── */
      function validateNick() {
        var v = nickInput.value.trim();
        var bad = v.length < 2;
        nickErr.classList.toggle('show', bad);
        nickField.classList.toggle('err-box', bad);
        return !bad;
      }
      nickInput.addEventListener('blur', validateNick);
      nickInput.addEventListener('input', function () {
        if (nickErr.classList.contains('show') && nickInput.value.trim().length >= 2) {
          validateNick();
        }
        markDirty();
      });

      /* ── signature count ── */
      sigInput.addEventListener('input', function () {
        sigNum.textContent = String(sigInput.value.length);
        markDirty();
      });

      /* ── segments & chips ── */
      document.querySelectorAll('#expSeg .seg-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('#expSeg .seg-btn').forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          markDirty();
        });
      });
      document.querySelectorAll('.chip').forEach(function (chip) {
        chip.addEventListener('click', function () {
          chip.classList.toggle('active');
          markDirty();
        });
      });

      /* ── save ── */
      saveBtn.addEventListener('click', function () {
        if (submitting) return;
        if (!validateNick()) {
          errSummary.classList.add('show');
          nickInput.focus();
          return;
        }
        errSummary.classList.remove('show');
        submitting = true;
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<span class="spinner"></span>保存中';
        setTimeout(function () {
          submitting = false;
          dirty = false;
          showToast('已保存', function () { window.location.href = 'ios-profile.html'; });
        }, 900);
      });
      document.getElementById('errLink').addEventListener('click', function (e) {
        e.preventDefault();
        nickInput.focus();
      });

      /* ── back with unsaved guard ── */
      backBtn.addEventListener('click', function () {
        if (!dirty) {
          window.location.href = 'ios-profile.html';
          return;
        }
        discardDlg.showModal();
      });
      document.getElementById('dlgStay').addEventListener('click', function () { discardDlg.close(); backBtn.focus(); });
      document.getElementById('dlgLeave').addEventListener('click', function () {
        dirty = false;
        discardDlg.close();
        window.location.href = 'ios-profile.html';
      });
      discardDlg.addEventListener('cancel', function (e) {
        e.preventDefault();
        backBtn.focus();
      });
    })();
  </script>
</body>
</html>
