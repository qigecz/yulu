<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>渔路 · 附近钓点列表 · iOS</title>
  <style>
    :root {
      --bg:      #f3f5f2;
      --surface: #ffffff;
      --fg:      #1a2420;
      --muted:   #647a70;
      --border:  #dce2dc;
      --accent:  #2a8f7a;

      --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
      --fg-soft:     color-mix(in oklch, var(--fg) 6%, transparent);

      --font-display: 'Iowan Old Style', 'Charter', Georgia, serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'SF Mono', Menlo, monospace;

      --fs-body: 15px;
      --fs-meta: 12px;
      --radius-card: 18px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: radial-gradient(60% 80% at 50% 0%, color-mix(in oklch, var(--accent) 6%, var(--bg)) 0%, var(--bg) 60%);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .stage { display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .caption {
      font-family: var(--font-mono); font-size: 12px;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    }
    .caption strong { color: var(--fg); font-weight: 500; }

    .device {
      position: relative; width: 390px; height: 844px;
      border-radius: 56px; padding: 12px;
      background: linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.04) inset, 0 0 0 2px #000 inset,
                  0 28px 60px -12px rgba(0,0,0,0.45), 0 8px 20px -8px rgba(0,0,0,0.35);
      isolation: isolate;
    }
    .device::before, .device::after {
      content: ''; position: absolute; width: 3px;
      background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.06) 8%, transparent 16%, transparent 84%, rgba(255,255,255,0.04) 92%, transparent 100%);
      top: 100px; bottom: 100px; pointer-events: none;
    }
    .device::before { left: -1px; }
    .device::after  { right: -1px; }
    .island {
      position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
      width: 124px; height: 36px; background: #000; border-radius: 999px; z-index: 30;
    }
    .btn-rail { position: absolute; width: 4px; background: #0a0a0c; border-radius: 2px; }
    .btn-rail.left-1  { left: -3px; top: 174px; height: 32px; }
    .btn-rail.left-2  { left: -3px; top: 220px; height: 60px; }
    .btn-rail.left-3  { left: -3px; top: 290px; height: 60px; }
    .btn-rail.right-1 { right: -3px; top: 250px; height: 100px; }

    .screen {
      position: relative; width: 100%; height: 100%;
      background: var(--bg); border-radius: 44px; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .statusbar {
      flex: 0 0 47px; padding: 18px 26px 0;
      display: flex; align-items: flex-start; justify-content: space-between;
      font-family: var(--font-body); font-size: 15px; font-weight: 600;
      color: var(--fg);
    }
    .statusbar .right { display: inline-flex; align-items: center; gap: 6px; }
    .statusbar svg { width: 17px; height: 11px; fill: var(--fg); }
    .statusbar .battery { width: 25px; }

    .content {
      flex: 1 1 auto; overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .content::-webkit-scrollbar { display: none; }

    .home-indicator { flex: 0 0 28px; position: relative; }
    .home-indicator::after {
      content: ''; position: absolute; left: 50%; bottom: 8px;
      transform: translateX(-50%); width: 134px; height: 5px;
      background: var(--fg); border-radius: 999px; opacity: 0.85;
    }

    .pad { padding-inline: 20px; }
    .meta { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--muted); }
    .num  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* header */
    .header {
      padding: 8px 20px 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .header .h-title { font-family: var(--font-display); font-size: 18px; letter-spacing: -0.01em; }
    .header .icon-btn {
      width: 36px; height: 36px; border-radius: 999px;
      background: var(--surface); border: 1px solid var(--border);
      display: grid; place-items: center; color: var(--fg); cursor: pointer;
    }
    .header .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; }
    .header .icon-btn:hover { border-color: color-mix(in oklch, var(--accent) 45%, var(--border)); }
    .header .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* search */
    .search-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 14px;
      color: var(--muted); font-size: 14px;
    }
    .search-bar svg { width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 1.8; flex-shrink: 0; }

    /* filter chips */
    .filter-scroll {
      display: flex; gap: 8px; overflow-x: auto;
      padding: 14px 20px 2px;
      -webkit-overflow-scrolling: touch;
    }
    .filter-scroll::-webkit-scrollbar { display: none; }
    .fchip {
      flex-shrink: 0; padding: 7px 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 999px; font-size: 13px; color: var(--fg);
      cursor: pointer; font-family: var(--font-body);
    }
    .fchip:hover { border-color: color-mix(in oklch, var(--accent) 45%, var(--border)); }
    .fchip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .fchip.on {
      background: var(--accent); color: #fff; border-color: transparent; font-weight: 600;
    }

    /* result meta row */
    .result-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px 10px;
    }
    .result-row .r-count { font-size: 13px; color: var(--muted); }
    .result-row .r-count strong { color: var(--fg); font-weight: 600; }
    .sort-group { display: flex; gap: 4px; }
    .sort-btn {
      padding: 5px 10px; border: none; background: none;
      font-family: var(--font-body); font-size: 12px; color: var(--muted);
      cursor: pointer; border-radius: 8px;
    }
    .sort-btn:hover { background: var(--fg-soft); }
    .sort-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .sort-btn.on { color: var(--accent); font-weight: 600; background: var(--accent-soft); }

    /* spot list card */
    .spot-list { padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }
    .spot-row {
      display: grid; grid-template-columns: 84px 1fr; gap: 12px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 10px;
      color: var(--fg); text-decoration: none;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .spot-row:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -8px rgba(0,0,0,0.14);
    }
    .spot-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .spot-row .s-thumb {
      width: 84px; height: 84px; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-soft), var(--fg-soft));
      border: 1px solid var(--border);
      display: grid; place-items: center;
      color: var(--muted); font-family: var(--font-mono); font-size: 9px;
    }
    .spot-row .s-body { min-width: 0; display: flex; flex-direction: column; }
    .spot-row .s-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .spot-row .s-name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
    .spot-row .s-rate {
      display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0;
      font-family: var(--font-mono); font-size: 12px; color: var(--accent); font-weight: 600;
    }
    .spot-row .s-rate svg { width: 11px; height: 11px; fill: #e8a33d; }
    .spot-row .s-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .spot-row .s-tags { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
    .spot-row .s-tag {
      padding: 2px 8px; border: 1px solid var(--border);
      border-radius: 999px; font-size: 10px; color: var(--muted);
    }
    .spot-row .s-foot {
      display: flex; align-items: center; gap: 10px; margin-top: auto;
      font-size: 11px; color: var(--muted);
      padding-top: 6px;
    }
    .spot-row .s-hot { color: var(--accent); font-family: var(--font-mono); }

    .list-end {
      font-family: var(--font-mono); font-size: 11px; color: var(--muted);
      text-align: center; padding: 16px 0 20px;
    }

    .empty-state {
      display: none; flex-direction: column; align-items: center; gap: 8px;
      padding: 48px 20px; text-align: center;
    }
    .empty-state.show { display: flex; }
    .empty-state .e-icon {
      width: 52px; height: 52px; border-radius: 16px;
      background: var(--fg-soft);
      display: grid; place-items: center;
    }
    .empty-state .e-icon svg { width: 24px; height: 24px; stroke: var(--muted); fill: none; stroke-width: 1.6; }
    .empty-state .e-text { font-size: 14px; color: var(--muted); }

    /* tab bar */
    .tabbar {
      flex: 0 0 auto;
      display: grid; grid-template-columns: repeat(var(--tabs, 5), 1fr);
      padding: 8px 8px 0;
      border-top: 1px solid var(--border);
      background: color-mix(in oklch, var(--surface) 92%, transparent);
      backdrop-filter: blur(20px);
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 8px 0; color: var(--muted); font-size: 10px; letter-spacing: 0.02em;
      text-decoration: none; font-family: var(--font-body);
    }
    .tab.active { color: var(--accent); }
    .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; }
    .tab.active svg { stroke-width: 2; }
  </style>
</head>
<body>
  <!-- shared icons -->
  <svg width="0" height="0" style="position:absolute;" aria-hidden="true">
    <symbol id="ic-star" viewBox="0 0 24 24">
      <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/>
    </symbol>
    <symbol id="ic-pin" viewBox="0 0 24 24">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/>
    </symbol>
  </svg>

  <div class="stage">
    <div class="caption"><strong>渔路</strong> · iOS · 附近钓点</div>
    <div class="device" data-od-id="device">
      <span class="btn-rail left-1" aria-hidden="true"></span>
      <span class="btn-rail left-2" aria-hidden="true"></span>
      <span class="btn-rail left-3" aria-hidden="true"></span>
      <span class="btn-rail right-1" aria-hidden="true"></span>
      <span class="island" aria-hidden="true"></span>

      <div class="screen">
        <div class="statusbar">
          <span class="num">9:41</span>
          <span class="right">
            <svg viewBox="0 0 17 11" aria-hidden="true">
              <rect x="0" y="7" width="3" height="4" rx="0.6"/>
              <rect x="4" y="5" width="3" height="6" rx="0.6"/>
              <rect x="8" y="3" width="3" height="8" rx="0.6"/>
              <rect x="12" y="0" width="3" height="11" rx="0.6"/>
            </svg>
            <svg viewBox="0 0 17 11" aria-hidden="true">
              <path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6L5 9.1c1-0.9 2.2-1.4 3.5-1.4 1.3 0 2.5 0.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6 0.7-5 2zM6.5 10.6l2 2 2-2c-0.5-0.5-1.2-0.8-2-0.8s-1.5 0.3-2 0.8z"/>
            </svg>
            <svg class="battery" viewBox="0 0 25 11" aria-hidden="true">
              <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/>
              <rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="currentColor" fill-opacity="0.45"/>
              <rect x="2" y="2" width="18" height="7" rx="1.4"/>
            </svg>
          </span>
        </div>

        <main class="content" data-od-id="content">
          <!-- header -->
          <div class="header" data-od-id="header">
            <button class="icon-btn" aria-label="返回">
              <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <span class="h-title">附近钓点</span>
            <button class="icon-btn" aria-label="切换地图视图">
              <svg viewBox="0 0 24 24"><path d="M9 20l-5.447 2.724A.5.5 0 0 1 3 22.382V4.618a1 1 0 0 1 .553-.894L9 1M9 20l6-3M9 20v-19M15 17l5.447 2.724A.5.5 0 0 0 21 19.382V1.618a1 1 0 0 0-.553-.894L15 1M15 17V1"/></svg>
            </button>
          </div>

          <!-- search -->
          <div class="pad" data-od-id="search">
            <div class="search-bar">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <span>搜索钓点名称、鱼种…</span>
            </div>
          </div>

          <!-- method filters -->
          <div class="filter-scroll" role="group" aria-label="钓法筛选" data-od-id="method-filters">
            <button class="fchip on" data-method="全部">全部</button>
            <button class="fchip" data-method="路亚">路亚</button>
            <button class="fchip" data-method="台钓">台钓</button>
            <button class="fchip" data-method="湖钓">湖钓</button>
            <button class="fchip" data-method="筏钓">筏钓</button>
            <button class="fchip" data-method="溪流">溪流</button>
          </div>

          <!-- result row -->
          <div class="result-row" data-od-id="result-row">
            <span class="r-count" id="resultCount">共 <strong>8</strong> 个钓点 · 按距离排序</span>
            <div class="sort-group" role="group" aria-label="排序方式">
              <button class="sort-btn on" data-sort="distance">距离</button>
              <button class="sort-btn" data-sort="rating">评分</button>
              <button class="sort-btn" data-sort="catch">渔获</button>
            </div>
          </div>

          <!-- list -->
          <div class="spot-list" id="spotList" data-od-id="spot-list"></div>

          <!-- empty state -->
          <div class="empty-state" id="emptyState" data-od-id="empty-state">
            <div class="e-icon">
              <svg viewBox="0 0 24 24"><use href="#ic-pin"/></svg>
            </div>
            <div class="e-text">该条件下暂无钓点，换个筛法试试</div>
          </div>

          <p class="list-end" id="listEnd">— 已加载附近全部 8 个钓点 —</p>
        </main>

        <nav class="tabbar" style="--tabs: 5;" data-od-id="tabbar">
          <a class="tab active" href="../mobile-ios.html">
            <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
            首页
          </a>
          <a class="tab" href="ios-route.html">
            <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            坑点
          </a>
          <a class="tab" href="ios-nav.html">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
            导航
          </a>
          <a class="tab" href="ios-learn.html">
            <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            学习
          </a>
          <a class="tab" href="ios-profile.html">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
            我的
          </a>
        </nav>

        <div class="home-indicator" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <script>
    // spot data — 与首页「附近热门钓点」数据保持一致并扩展
    const spots = [
      { name: '千岛湖 · 碧溪湾', dist: 2.3, method: '路亚', fish: '鲈鱼', rating: 4.8, catch7d: 86, tags: ['深水', '岩石底'], hot: true },
      { name: '富春江 · 钓台', dist: 5.1, method: '台钓', fish: '鲫鱼', rating: 4.6, catch7d: 42, tags: ['缓流', '沙底'] },
      { name: '太湖 · 东山半岛', dist: 8.7, method: '湖钓', fish: '综合', rating: 4.5, catch7d: 37, tags: ['浅滩', '水草'] },
      { name: '青山湖 · 西坝', dist: 12.4, method: '路亚', fish: '翘嘴', rating: 4.7, catch7d: 51, tags: ['深水', '网箱边'] },
      { name: '苕溪 · 古埠段', dist: 15.2, method: '溪流', fish: '马口', rating: 4.9, catch7d: 64, tags: ['浅滩', '碎石底'] },
      { name: '新安江 · 白沙湾', dist: 23.8, method: '筏钓', fish: '鳊鱼', rating: 4.4, catch7d: 28, tags: ['缓流', '网箱边'] },
      { name: '东苕溪 · 闸口', dist: 26.5, method: '台钓', fish: '鲤鱼', rating: 4.3, catch7d: 19, tags: ['缓流', '桥墩'] },
      { name: '富春江 · 七里泷', dist: 31.0, method: '路亚', fish: '鳜鱼', rating: 4.8, catch7d: 45, tags: ['急流', '礁石'] }
    ];

    const state = { method: '全部', sort: 'distance' };
    const sortNames = { distance: '距离', rating: '评分', catch: '渔获' };
    const listEl = document.getElementById('spotList');
    const emptyEl = document.getElementById('emptyState');
    const endEl = document.getElementById('listEnd');
    const countEl = document.getElementById('resultCount');

    function render() {
      let arr = spots.filter(s => state.method === '全部' || s.method === state.method);
      if (state.sort === 'distance') arr.sort((a, b) => a.dist - b.dist);
      if (state.sort === 'rating') arr.sort((a, b) => b.rating - a.rating);
      if (state.sort === 'catch') arr.sort((a, b) => b.catch7d - a.catch7d);

      listEl.innerHTML = '';
      arr.forEach((s, i) => {
        const a = document.createElement('a');
        a.className = 'spot-row';
        a.href = 'ios-spot-detail.html';
        a.setAttribute('data-od-id', 'spot-row-' + (i + 1));
        a.innerHTML =
          '<div class="s-thumb">[实景]</div>' +
          '<div class="s-body">' +
          '<div class="s-top">' +
          '<span class="s-name"></span>' +
          '<span class="s-rate"><svg viewBox="0 0 24 24"><use href="#ic-star"/></svg><span class="num"></span></span>' +
          '</div>' +
          '<div class="s-meta"></div>' +
          '<div class="s-tags"></div>' +
          '<div class="s-foot"></div>' +
          '</div>';
        a.querySelector('.s-name').textContent = s.name;
        a.querySelector('.s-rate .num').textContent = s.rating.toFixed(1);
        a.querySelector('.s-meta').textContent = '距你 ' + s.dist.toFixed(1) + 'km · ' + s.fish + ' · ' + s.method;
        const tagWrap = a.querySelector('.s-tags');
        s.tags.forEach(t => {
          const el = document.createElement('span');
          el.className = 's-tag';
          el.textContent = t;
          tagWrap.appendChild(el);
        });
        const foot = a.querySelector('.s-foot');
        foot.innerHTML =
          (s.hot ? '<span class="s-hot">热门 · 出鱼率 86%</span>' : '') +
          '<span>近7天渔获 <span class="num">' + s.catch7d + '</span> 尾</span>' +
          '<span style="margin-left:auto; color:var(--accent); font-weight:500;">详情 →</span>';
        listEl.appendChild(a);
      });

      const hasResults = arr.length > 0;
      emptyEl.classList.toggle('show', !hasResults);
      endEl.style.display = hasResults ? '' : 'none';
      endEl.textContent = '— 已加载附近全部 ' + arr.length + ' 个钓点 —';
      countEl.innerHTML = '共 <strong>' + arr.length + '</strong> 个钓点 · 按' + sortNames[state.sort] + '排序';
    }

    // method filter
    document.querySelectorAll('.fchip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.fchip').forEach(c => c.classList.toggle('on', c === chip));
        state.method = chip.dataset.method;
        render();
      });
    });

    // sort
    document.querySelectorAll('.sort-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('on', b === btn));
        state.sort = btn.dataset.sort;
        render();
      });
    });

    render();
  </script>
</body>
