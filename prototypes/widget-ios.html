<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>渔路 · iOS 桌面小组件</title>
  <style>
    :root {
      --bg: #f3f5f2; --surface: #ffffff; --fg: #1a2420; --muted: #647a70;
      --border: #dce2dc; --accent: #2a8f7a;
      --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
      --fg-soft: color-mix(in oklch, var(--fg) 6%, transparent);
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: linear-gradient(160deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      font-family: var(--font-body);
      display: flex; align-items: center; justify-content: center;
      gap: 40px; flex-wrap: wrap; padding: 40px;
    }

    .widget-stage {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    .widget-label {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em;
      text-transform: uppercase; color: rgba(255,255,255,0.5);
    }

    /* Medium widget (4×2) */
    .widget-medium {
      width: 360px; height: 170px;
      background: var(--surface);
      border-radius: 24px;
      padding: 18px 20px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.15);
      position: relative;
      overflow: hidden;
    }
    .widget-medium::after {
      content: ''; position: absolute; top: -30px; right: -30px;
      width: 100px; height: 100px; border-radius: 50%;
      background: var(--accent-soft); opacity: 0.4;
    }

    .wm-left { display: flex; flex-direction: column; gap: 6px; position: relative; z-index: 1; }
    .wm-app-name {
      font-size: 13px; font-weight: 700; color: var(--accent); margin: 0;
    }
    .wm-weather {
      font-size: 24px; font-weight: 700; color: var(--fg); margin: 0;
      line-height: 1.1;
    }
    .wm-weather span { font-size: 14px; font-weight: 500; color: var(--muted); }
    .wm-spot {
      margin: 0; font-size: 13px; color: var(--muted); line-height: 1.3;
    }
    .wm-spot strong { color: var(--fg); font-weight: 600; }
    .wm-action {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 6px 12px; margin-top: auto;
      background: var(--accent); color: #fff;
      border-radius: 12px; font-size: 12px; font-weight: 600;
      width: fit-content;
    }
    .wm-action svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; }

    .wm-right {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 6px; position: relative; z-index: 1;
    }
    .wm-map {
      width: 80px; height: 80px; border-radius: 16px;
      background: linear-gradient(135deg, var(--accent-soft), var(--fg-soft));
      border: 1px solid var(--border);
      display: grid; place-items: center; position: relative;
    }
    .wm-map .wm-pin {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent); border: 2px solid var(--surface);
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .wm-map .wm-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 20px 20px;
      opacity: 0.4; border-radius: 16px;
    }

    /* Small widget (2×2) */
    .widget-small {
      width: 170px; height: 170px;
      background: var(--surface);
      border-radius: 24px;
      padding: 16px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 6px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.15);
    }
    .ws-icon {
      width: 44px; height: 44px; border-radius: 14px;
      background: var(--accent); display: grid; place-items: center;
    }
    .ws-icon svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 1.6; }
    .ws-name { font-size: 13px; font-weight: 700; color: var(--accent); margin: 0; }
    .ws-count {
      font-size: 36px; font-weight: 700; color: var(--fg); margin: 0;
      font-family: var(--font-mono); line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .ws-label { font-size: 11px; color: var(--muted); margin: 0; }
    .ws-weather {
      font-size: 12px; color: var(--muted); margin: 4px 0 0;
    }
    .ws-weather strong { color: var(--fg); }
  </style>
</head>
<body>
  <!-- Medium widget -->
  <div class="widget-stage">
    <div class="widget-medium">
      <div class="wm-left">
        <p class="wm-app-name">渔路</p>
        <p class="wm-weather">26°C <span>晴 · 东南风 2级</span></p>
        <p class="wm-spot"><strong>千岛湖 · 碧溪湾</strong> 2.3km</p>
        <div class="wm-action">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
          开始导航
        </div>
      </div>
      <div class="wm-right">
        <div class="wm-map">
          <div class="wm-grid"></div>
          <div class="wm-pin"></div>
        </div>
        <p style="font-size:10px; color:var(--muted); margin:0; font-family:var(--font-mono);">3 附近钓点</p>
      </div>
    </div>
    <div class="widget-label">Medium Widget · 360 × 170</div>
  </div>

  <!-- Small widget -->
  <div class="widget-stage">
    <div class="widget-small">
      <div class="ws-icon">
        <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      </div>
      <p class="ws-name">渔路</p>
      <p class="ws-count">3</p>
      <p class="ws-label">附近钓点</p>
      <p class="ws-weather"><strong>26°C</strong> · 宜出钓</p>
    </div>
    <div class="widget-label">Small Widget · 170 × 170</div>
  </div>
</body>
</html>
